name: Automated Deployment to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Connecting to server and fetching new code..."
            cd /home/ubuntu/app/cypr/backend || cd ~/app/cypr/backend
            git pull origin main

            echo "Making Maven wrapper executable and building JAR..."
            chmod +x ./mvnw
            if ! ./mvnw clean package -DskipTests; then
              echo "Maven build failed! Aborting deployment."
              exit 1
            fi

            echo "Copying new artifact..."
            cp target/*.jar app.jar

            echo "Restarting Systemd Service (cypr-backend)..."
            sudo systemctl restart cypr-backend

            echo "Waiting for backend service health check..."
            HEALTHCHECK_PASSED=false
            for i in {1..15}; do
              sleep 3
              if curl -sf http://localhost:8080/api/v1/system/actuator/health > /dev/null 2>&1; then
                HEALTHCHECK_PASSED=true
                echo "Backend application is HEALTHY and UP on port 8080!"
                break
              fi
              echo "  Attempt $i/15: Warming up..."
            done

            if [ "$HEALTHCHECK_PASSED" = false ]; then
              echo "Health check failed after 45s! Deployment marked as FAILED."
              echo "--- Systemd Recent Journal Logs ---"
              sudo journalctl -u cypr-backend -n 35 --no-pager
              exit 1
            fi

            echo "Deployment finished successfully!"
